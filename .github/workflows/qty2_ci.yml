name: QuantyCoin 2.0 (QTY2) CI

on:
  push:
    branches:
      - main
      - master
      - 'v2**'
  pull_request:
    branches:
      - main
      - master
      - 'v2**'

concurrency:
  group: qty2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Zero-Leak Git Policy & Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Secret Scanner
        run: python scripts/verify_security.py

  python-test-matrix:
    name: Test Suite (${{ matrix.os }} - Py ${{ matrix.python-version }})
    needs: secret-scan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pytest
      - name: Run Crypto & Core Unit Tests
        run: |
          python tests/test_crypto.py
          python tests/test_core.py
          python tests/test_p2p.py
      - name: Run Stratum V1 Integration Test
        run: python tests/test_functional_stratum.py
      - name: Run Full Multi-Node Test Suite
        run: python tests/test_runner.py
      - name: Run Multi-Node Stress, Hardness & Reorg Matrix
        run: python tests/test_multinode_stress.py
