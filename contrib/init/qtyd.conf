description "QTY Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env QTYD_BIN="/usr/bin/qtyd"
env QTYD_USER="qty"
env QTYD_GROUP="qty"
env QTYD_PIDDIR="/var/run/qtyd"
# upstart can't handle variables constructed with other variables
env QTYD_PIDFILE="/var/run/qtyd/qtyd.pid"
env QTYD_CONFIGFILE="/etc/qty/qty.conf"
env QTYD_DATADIR="/var/lib/qtyd"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # qtyd will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$QTYD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run qtyd."
        echo "The setting must appear in $QTYD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"QTY Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$QTYD_PIDDIR"
    chmod 0755 "$QTYD_PIDDIR"
    chown $QTYD_USER:$QTYD_GROUP "$QTYD_PIDDIR"
    chown $QTYD_USER:$QTYD_GROUP "$QTYD_CONFIGFILE"
    chmod 0660 "$QTYD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$QTYD_PIDFILE" \
    --chuid $QTYD_USER:$QTYD_GROUP \
    --exec "$QTYD_BIN" \
    -- \
    -pid="$QTYD_PIDFILE" \
    -conf="$QTYD_CONFIGFILE" \
    -datadir="$QTYD_DATADIR" \
    -disablewallet \
    -daemon

