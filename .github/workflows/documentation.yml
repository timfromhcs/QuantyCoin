name: Documentation & Link Integrity

on:
  push:
    branches:
      - main
      - master
      - 'v2**'
  pull_request:
    branches:
      - main
      - master
      - 'v2**'

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Markdown Links & Standards Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Documentation Integrity
        run: python scripts/verify_documentation.py
