<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 180" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="brandCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (scaled to 160x160, offset x=10, y=10) -->
  <g transform="translate(10, 10) scale(0.3125)">
    <!-- Outer Ring -->
    <path d="M 256 48
             C 370.87 48 464 141.13 464 256
             C 464 308.28 444.64 356.12 412.57 392.52
             L 468 448
             L 420 464
             L 364.58 408.58
             C 333.15 439.46 289.47 464 256 464
             C 141.13 464 48 370.87 48 256
             C 48 141.13 141.13 48 256 48 Z" 
          fill="none" 
          stroke="url(#brandGradient)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Grid -->
    <circle cx="256" cy="256" r="128" fill="none" stroke="#0284C7" stroke-width="12" stroke-dasharray="16 12" opacity="0.6"/>
    
    <!-- Precision Core -->
    <polygon points="256,176 336,256 256,336 176,256" fill="url(#brandCore)" opacity="0.95" />
    
    <!-- Dynamic Q-Tail -->
    <path d="M 296 296 L 448 448 M 412 464 L 464 412" 
          stroke="url(#brandCore)" 
          stroke-width="28" 
          stroke-linecap="round" />
    
    <!-- PoW Validation Crosshairs -->
    <circle cx="256" cy="256" r="32" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="16" fill="#0F172A" />
    <circle cx="256" cy="176" r="8" fill="#38BDF8" />
    <circle cx="336" cy="256" r="8" fill="#38BDF8" />
    <circle cx="256" cy="336" r="8" fill="#38BDF8" />
    <circle cx="176" cy="256" r="8" fill="#38BDF8" />
  </g>

  <!-- Wordmark Typography -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="195" y="105" font-size="64" font-weight="900" letter-spacing="-1px" fill="#F8FAFC">QUANTY</text>
    <text x="475" y="105" font-size="64" font-weight="400" letter-spacing="-1px" fill="#38BDF8">COIN</text>
    
    <!-- Protocol Badge -->
    <rect x="645" y="62" width="68" height="28" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5" />
    <text x="679" y="81" font-size="14" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="1px">QTY2</text>
    
    <!-- Subtitle / Architecture descriptor -->
    <text x="198" y="142" font-size="15" font-weight="600" fill="#94A3B8" letter-spacing="2.5px">INDEPENDENT SHA-256D LAYER-1</text>
  </g>
</svg>
