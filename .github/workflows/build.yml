name: Cloud Build & Platform Verification

on:
  push:
    branches:
      - main
      - master
      - 'v2**'
  pull_request:
    branches:
      - main
      - master
      - 'v2**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-build:
    name: Build & Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller qrcode pillow pyside6

      - name: Verify Code Compilation
        run: |
          python -m py_compile quantyd_cli.py quanty_node_app.py quanty_wallet_cli.py quanty_wallet_full_app.py quanty_miner_cli.py quanty_miner_app.py quanty_suite_app.py

      - name: Smoke Build CLI Executables
        env:
          PYTHONPATH: .
        run: |
          python -c "import os; os.makedirs('dist/bin', exist_ok=True)"
          python -m PyInstaller --onefile --paths . --name "quantyd" quantyd_cli.py --distpath dist/bin
          python -m PyInstaller --onefile --paths . --name "quanty-wallet" quanty_wallet_cli.py --distpath dist/bin
          python -m PyInstaller --onefile --paths . --name "quanty-miner" quanty_miner_cli.py --distpath dist/bin

      - name: Upload Smoke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantycoin-binaries-${{ matrix.os }}
          path: dist/bin/
          retention-days: 7
