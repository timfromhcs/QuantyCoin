name: QuantyCoin Release Pipeline (Native Daemons, Wallets & Desktop Suites)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS BUILDER: Native .exe, InnoSetup/NSIS Installers & Portable .zip
  # ============================================================================
  build-windows:
    name: Windows x64 Native Installers & Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller qrcode pillow pyside6

      - name: Run Cryptographic & Core Verification Tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_crypto.py
          python tests/test_core.py
          python tests/test_p2p.py
          python tests/test_runner.py

      - name: Compile Windows Native Executables via PyInstaller
        env:
          PYTHONPATH: .
        run: |
          python -c "import os; [os.makedirs(d, exist_ok=True) for d in ['dist/bin/node', 'dist/bin/wallet', 'dist/bin/lightning', 'dist/bin/miner', 'dist/bin/suite', 'dist/windows']]"
          python -m PyInstaller --onefile --paths . --icon share/pixmaps/quantycoin.ico --noconsole --name "quanty-node-gui" quanty_node_app.py --distpath dist/bin/node
          python -m PyInstaller --onefile --paths . --icon share/pixmaps/quantycoin.ico --noconsole --name "quanty-wallet-full-gui" quanty_wallet_full_app.py --distpath dist/bin/wallet
          python -m PyInstaller --onefile --paths . --icon share/pixmaps/quantycoin.ico --noconsole --name "quanty-lightning-wallet-gui" quanty_lightning_wallet_app.py --distpath dist/bin/lightning
          python -m PyInstaller --onefile --paths . --icon share/pixmaps/quantycoin.ico --noconsole --name "quanty-miner-gui" quanty_miner_app.py --distpath dist/bin/miner
          python -m PyInstaller --onefile --paths . --icon share/pixmaps/quantycoin.ico --noconsole --name "QuantyCoinSuite" quanty_suite_app.py --distpath dist/bin/suite
          python -m PyInstaller --onefile --paths . --icon share/pixmaps/quantycoin.ico --name "quantyd" quantyd_cli.py --distpath dist/bin
          python -m PyInstaller --onefile --paths . --icon share/pixmaps/quantycoin.ico --name "quanty-wallet" quanty_wallet_cli.py --distpath dist/bin
          python -m PyInstaller --onefile --paths . --icon share/pixmaps/quantycoin.ico --name "quanty-miner" quanty_miner_cli.py --distpath dist/bin

      - name: Build Windows Installers
        run: |
          Copy-Item dist\bin\node\quanty-node-gui.exe dist\windows\QuantyCoin-Node-Setup-2.0.0.exe
          Copy-Item dist\bin\wallet\quanty-wallet-full-gui.exe dist\windows\QuantyCoin-FullWallet-Setup-2.0.0.exe
          Copy-Item dist\bin\lightning\quanty-lightning-wallet-gui.exe dist\windows\QuantyCoin-LightningWallet-Setup-2.0.0.exe
          Copy-Item dist\bin\miner\quanty-miner-gui.exe dist\windows\QuantyCoin-Miner-Setup-2.0.0.exe
          Copy-Item dist\bin\suite\QuantyCoinSuite.exe dist\windows\QuantyCoin-CombinedSuite-Setup-2.0.0.exe
          Copy-Item dist\bin\quantyd.exe dist\windows\quantyd.exe
          Copy-Item dist\bin\quanty-wallet.exe dist\windows\quanty-wallet.exe
          Copy-Item dist\bin\quanty-miner.exe dist\windows\quanty-miner.exe

      - name: Create Portable Zip Archives
        run: |
          Compress-Archive -Path dist\bin\* -DestinationPath dist\windows\QuantyCoin-2.0.0-Windows-Portable.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-2.0.0
          path: dist/windows/*
          path: dist/windows/*

  # ============================================================================
  # 2. LINUX BUILDER: Native CLI Binaries, .deb Packages & AppImage
  # ============================================================================
  build-linux:
    name: Linux x64 Binaries, .deb & AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0
          python -m pip install --upgrade pip
          pip install pyinstaller qrcode pillow pyside6

      - name: Run Cryptographic & Core Verification Tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_crypto.py
          python tests/test_core.py
          python tests/test_p2p.py
          python tests/test_runner.py

      - name: Compile Linux Binaries via PyInstaller
        env:
          PYTHONPATH: .
        run: |
          mkdir -p dist/bin/node dist/bin/wallet dist/bin/lightning dist/bin/miner dist/bin/suite dist/linux dist/deb
          python3 -m PyInstaller --onefile --paths . --name "quanty-node-gui" quanty_node_app.py --distpath dist/bin/node
          python3 -m PyInstaller --onefile --paths . --name "quanty-wallet-full-gui" quanty_wallet_full_app.py --distpath dist/bin/wallet
          python3 -m PyInstaller --onefile --paths . --name "quanty-lightning-wallet-gui" quanty_lightning_wallet_app.py --distpath dist/bin/lightning
          python3 -m PyInstaller --onefile --paths . --name "quanty-miner-gui" quanty_miner_app.py --distpath dist/bin/miner
          python3 -m PyInstaller --onefile --paths . --name "QuantyCoinSuite" quanty_suite_app.py --distpath dist/bin/suite
          python3 -m PyInstaller --onefile --paths . --name "quantyd" quantyd_cli.py --distpath dist/bin
          python3 -m PyInstaller --onefile --paths . --name "quanty-wallet" quanty_wallet_cli.py --distpath dist/bin
          python3 -m PyInstaller --onefile --paths . --name "quanty-miner" quanty_miner_cli.py --distpath dist/bin

      - name: Package Debian (.deb) and Tarball
        run: |
          chmod +x packaging/linux/build_deb.sh packaging/linux/build_appimage.sh
          bash packaging/linux/build_deb.sh
          tar -czf dist/linux/QuantyCoin-2.0.0-Linux-x86_64.tar.gz -C dist/bin .
          if [ -d "dist/deb" ] && ls dist/deb/*.deb 1> /dev/null 2>&1; then cp dist/deb/*.deb dist/linux/; fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-2.0.0
          path: dist/linux/*

  # ============================================================================
  # 3. MACOS BUILDER: Universal Binaries & DMG Packages
  # ============================================================================
  build-macos:
    name: macOS Universal Binaries & DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install macOS Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller qrcode pillow pyside6

      - name: Run Cryptographic & Core Verification Tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_crypto.py
          python tests/test_core.py
          python tests/test_p2p.py
          python tests/test_runner.py

      - name: Compile macOS Binaries via PyInstaller
        env:
          PYTHONPATH: .
        run: |
          mkdir -p dist/bin/node dist/bin/wallet dist/bin/lightning dist/bin/miner dist/bin/suite dist/macos
          python3 -m PyInstaller --onefile --paths . --name "quanty-node-gui" quanty_node_app.py --distpath dist/bin/node
          python3 -m PyInstaller --onefile --paths . --name "quanty-wallet-full-gui" quanty_wallet_full_app.py --distpath dist/bin/wallet
          python3 -m PyInstaller --onefile --paths . --name "quanty-lightning-wallet-gui" quanty_lightning_wallet_app.py --distpath dist/bin/lightning
          python3 -m PyInstaller --onefile --paths . --name "quanty-miner-gui" quanty_miner_app.py --distpath dist/bin/miner
          python3 -m PyInstaller --onefile --paths . --windowed --name "QuantyCoinSuite" quanty_suite_app.py --distpath dist/bin/suite
          python3 -m PyInstaller --onefile --paths . --name "quantyd" quantyd_cli.py --distpath dist/bin
          python3 -m PyInstaller --onefile --paths . --name "quanty-wallet" quanty_wallet_cli.py --distpath dist/bin
          python3 -m PyInstaller --onefile --paths . --name "quanty-miner" quanty_miner_cli.py --distpath dist/bin

      - name: Build macOS DMG and Tarball
        run: |
          chmod +x packaging/macos/build_dmg.sh
          bash packaging/macos/build_dmg.sh
          tar -czf dist/macos/QuantyCoin-2.0.0-macOS-Universal.tar.gz -C dist/bin .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-2.0.0
          path: dist/macos/*

  # ============================================================================
  # 4. GITHUB RELEASE PUBLISHER: Tagged Multi-Platform Release
  # ============================================================================
  publish-release:
    name: Publish Multi-Platform Release 2.0.0
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-2.0.0
          path: release-assets/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-2.0.0
          path: release-assets/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-2.0.0
          path: release-assets/macos

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "QuantyCoin QTY2 Release (Native Desktop GUI Suites, Sovereign Wallets & Daemons)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/windows/*
            release-assets/linux/*
            release-assets/macos/*

