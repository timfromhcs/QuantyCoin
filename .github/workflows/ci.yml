name: CI (Test Matrix & Protocol Validation)

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test Suite (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pytest

      - name: Build Native Dilithium Library (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -O3 -shared -fPIC -DDILITHIUM_MODE=2 \
            -Isrc/crypto -Isrc/crypto/dilithium/ref \
            src/crypto/dilithium_wrapper.c \
            src/crypto/dilithium/ref/fips202.c \
            src/crypto/dilithium/ref/ntt.c \
            src/crypto/dilithium/ref/packing.c \
            src/crypto/dilithium/ref/poly.c \
            src/crypto/dilithium/ref/polyvec.c \
            src/crypto/dilithium/ref/randombytes.c \
            src/crypto/dilithium/ref/reduce.c \
            src/crypto/dilithium/ref/rounding.c \
            src/crypto/dilithium/ref/sign.c \
            src/crypto/dilithium/ref/symmetric-shake.c \
            -o src/crypto/libqtydilithium.so

      - name: Run Cryptographic & Core Unit Tests
        run: |
          python tests/test_crypto.py
          python tests/test_core.py
          python tests/test_p2p.py

      - name: Run QTY4 Genesis Consensus Audit
        run: python scripts/verify_genesis.py

      - name: Run QTY4 Adversarial Hardening Test
        run: python tests/test_adversarial_qty4.py

      - name: Run Dual-PoW Security & Simulation
        run: python tests/test_dualpow_security_simulation.py

      - name: Run Stratum V1 Mining Integration Test
        run: python tests/test_functional_stratum.py

      - name: Run Full Functional Multi-Node Test Suite
        run: python tests/test_runner.py

      - name: Run Multi-Node Stress, Hardness & Reorg Matrix
        run: python tests/test_multinode_stress.py
