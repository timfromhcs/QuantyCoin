name: Security & Cryptographic Integrity

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-leak-audit:
    name: Zero-Leak Git Policy & Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Zero-Leak Scanner
        run: python scripts/verify_security.py

  genesis-cryptographic-audit:
    name: Genesis PoW & Consensus Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Public Genesis Consensus
        run: python scripts/verify_genesis.py

  supply-chain-sbom:
    name: Supply-Chain SBOM & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SBOM
        run: python scripts/generate_sbom.py

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantycoin-sbom
          path: sbom/
          retention-days: 30
